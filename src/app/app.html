<div class="app-container">
  <!-- Top Bar -->
  <mat-toolbar class="top-bar">
    <div class="top-bar-left">
      <button mat-icon-button (click)="toggleSidebar()" class="menu-button">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="app-title">Smart Home UI</span>
    </div>

    <div class="top-bar-right">
      <mat-tab-group
        [selectedIndex]="selectedTabIndex()"
        (selectedIndexChange)="onTabChange($event)"
        class="top-tabs"
      >
        <mat-tab label="Overview"></mat-tab>
        <mat-tab label="Lights"></mat-tab>
      </mat-tab-group>
    </div>
  </mat-toolbar>

  <!-- Main Content -->
  <div class="main-container">
    <app-sidebar [isExpanded]="sidebarExpanded()" (sidebarToggle)="toggleSidebar()"> </app-sidebar>
    <app-dashboard [selectedTabIndex]="selectedTabIndex()"></app-dashboard>
  </div>
</div>
